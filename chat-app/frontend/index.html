<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Chat App</h1>

    <section id="messages-section">
      <div id="messages"></div>
    </section>

    <section id="input-section">
      <input type="text" id="input-user" placeholder="Your name" required />
      <input type="text" id="input-text" placeholder="Type a message..." required />
      <button id="send-btn">Send</button>
      <p id="status"></p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
